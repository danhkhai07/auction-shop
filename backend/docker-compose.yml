version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: auction-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: danhkhai07/auction-shop-backend:latest
    container_name: auction-app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_DB_URL=r2dbc:postgresql://db:5432/${POSTGRES_DB}
      - APP_DB_USERNAME=${POSTGRES_USER}
      - APP_DB_PASSWORD=${POSTGRES_PASSWORD}
      - SECURITY_JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data: